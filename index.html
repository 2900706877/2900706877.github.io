<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅所欲言 - Web3去中心化论坛 (Rollup版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS 保持不变 */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #F3F4F6;
            --bg-body: #F9FAFB;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 0; }
        .nav-container { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .brand svg { width: 32px; height: 32px; fill: var(--primary); }
        
        #wallet-status { display: flex; align-items: center; gap: 12px; }
        #wallet-address { background: var(--secondary); padding: 8px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); font-family: monospace; display: none; }
        #wallet-address:not(:empty) { display: block; }

        .container { display: grid; grid-template-columns: 320px 1fr; gap: 32px; max-width: 1280px; margin: 32px auto; padding: 0 24px; }
        
        .card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; transition: box-shadow 0.3s ease; }
        .card:hover { box-shadow: var(--shadow-md); }
        .card-header { font-size: 1.125rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px;}

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
        .modern-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; background: var(--bg-body); transition: all 0.2s; font-family: inherit; }
        .modern-input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        textarea.modern-input { resize: vertical; min-height: 100px; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; border: none; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3); }
        .btn-secondary { background: var(--secondary); color: var(--text-main); }
        .btn-secondary:hover { background: #E5E7EB; }
        .btn-sm { padding: 8px 16px; font-size: 0.875rem; }

        .section-list { display: flex; flex-direction: column; gap: 12px; }
        .section-item { padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; background: var(--surface); display: flex; gap: 16px; align-items: flex-start; }
        .section-item:hover { border-color: var(--primary); background: #F8FAFC; transform: translateX(4px); }
        .section-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(79, 70, 229, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.25rem; flex-shrink: 0; }
        .section-details h4 { font-size: 1rem; color: var(--text-main); margin-bottom: 4px; }
        .section-details p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

        .feed-tools { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; display: flex; gap: 8px; }
        .search-box .modern-input { border-radius: 30px; padding-left: 20px; }
        .sort-controls select { border-radius: 30px; padding: 10px 20px; background: var(--surface); border: 1px solid var(--border); font-size: 0.9rem; cursor: pointer; outline: none; }

        .post { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform 0.2s; }
        .post:hover { box-shadow: var(--shadow-md); }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #6366f1); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .post-meta-info { flex: 1; }
        .post-author { display: block; font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
        .post-time { font-size: 0.8rem; color: var(--text-muted); }
        .badge-section { background: rgba(79, 70, 229, 0.1); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .post-title { font-size: 1.25rem; margin-bottom: 12px; color: var(--text-main); }
        .post-content { color: #374151; font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; white-space: pre-wrap; }
        
        .post-image { max-width: 100%; max-height: 400px; border-radius: var(--radius-md); margin-top: 12px; border: 1px solid var(--border); }
        .attachment-box { display: flex; align-items: center; justify-content: space-between; background: var(--secondary); padding: 12px 16px; border-radius: var(--radius-md); margin-top: 16px; }
        
        .post-actions-bar { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
        .action-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; background: transparent; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; cursor: pointer; border-radius: 20px; transition: all 0.2s; }
        .action-btn:hover { background: var(--secondary); color: var(--primary); }
        .action-btn svg { width: 18px; height: 18px; }

        .comment-form-container { margin-top: 20px; background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); }
        .comments-list { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
        .comment-item { display: flex; gap: 12px; background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #2dd4bf); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .comment-author { font-weight: 600; font-size: 0.875rem; }
        .comment-time { font-size: 0.75rem; color: var(--text-muted); }
        .comment-text { font-size: 0.9rem; color: #4B5563; margin-bottom: 8px; }
        .comment-like-btn { padding: 4px 8px; font-size: 0.8rem; }

        .file-input-wrapper { display: flex; align-items: center; gap: 12px; }
        .file-input-wrapper input[type=file] { display: none; }
        .file-input-label { display: inline-block; background: var(--secondary); color: var(--text-main); padding: 10px 20px; border-radius: var(--radius-md); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; border: 1px dashed #9CA3AF; }
        .file-input-label:hover { background: #E5E7EB; border-color: var(--primary); }
        #image-preview { max-width: 100%; border-radius: var(--radius-md); margin-top: 12px; }

        .status { position: fixed; bottom: 24px; right: 24px; padding: 16px 24px; border-radius: var(--radius-md); font-weight: 500; z-index: 9999; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; box-shadow: var(--shadow-lg); max-width: 350px; }
        .status-success { background-color: var(--success); color: white; }
        .status-error { background-color: var(--danger); color: white; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 992px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { order: 2; }
            .main-feed { order: 1; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                畅所欲言 (Rollup版)
            </div>
            <div id="wallet-status">
                <span id="wallet-address"></span>
                <button id="connect-wallet" class="btn btn-primary">连接钱包</button>
            </div>
        </div>
    </nav>

    <div class="container main-layout">
        <aside class="sidebar">
            <div class="card">
                <div class="card-header">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14"></path></svg>
                    创建分区
                </div>
                <div class="form-group">
                    <input type="text" id="section-name" class="modern-input" placeholder="输入分区名称">
                </div>
                <div class="form-group">
                    <textarea id="section-description" class="modern-input" placeholder="输入一句话分区描述..." style="min-height: 80px;"></textarea>
                </div>
                <button onclick="createSection()" class="btn btn-primary" style="width: 100%;">签名并创建</button>
            </div>
    
            <div class="card" style="background: transparent; box-shadow: none; border: none; padding: 0;">
                <div class="card-header" style="border-bottom: none; margin-bottom: 10px;">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    探索分区
                </div>
                <div id="section-list" class="section-list">
                    </div>
            </div>
        </aside>
    
        <main class="main-feed">
            <div class="card" style="border: 2px dashed var(--primary); background: rgba(79, 70, 229, 0.05);">
                <div class="card-header" style="color: var(--primary); border-bottom: 1px dashed rgba(79, 70, 229, 0.3);">
                    ⚙️ 节点 Relayer 打包控制台
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p>本地内存池待打包操作: <strong id="mempool-count" style="font-size: 1.5rem; color: var(--primary);">0</strong> 条</p>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">实际项目中，此操作由后端服务器定时自动触发执行上链</p>
                    </div>
                    <button id="batch-submit-btn" class="btn btn-primary" onclick="submitBatchToChain()">执行打包上链 (需付Gas)</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    发布动态 (无Gas签名)
                </div>
                <div class="form-group">
                    <select id="post-section" class="modern-input">
                        <option value="">请选择发帖分区...</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="post-title" class="modern-input" placeholder="标题：让大家知道你想说什么" style="font-weight: 500; font-size: 1.1rem;">
                </div>
                <div class="form-group">
                    <textarea id="post-content" class="modern-input" placeholder="在此输入帖子正文..."></textarea>
                </div>
                <div class="form-group">
                    <div class="file-input-wrapper">
                        <label for="post-image" class="file-input-label">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="vertical-align: middle; margin-right: 4px;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            添加图片或TXT附件
                        </label>
                        <input type="file" id="post-image" accept=".jpg,.jpeg,.txt" onchange="previewFile(this)">
                        <span id="file-name" style="font-size: 0.85rem; color: var(--text-muted);"></span>
                    </div>
                    <img id="image-preview" alt="图片预览" style="display: none;">
                    <div id="text-preview" style="display: none; margin-top: 12px; padding: 16px; background: var(--bg-body); border-radius: var(--radius-sm); border: 1px solid var(--border); max-height: 200px; overflow-y: auto; font-size: 0.9rem;"></div>
                </div>
                <button onclick="createPost()" class="btn btn-primary">签名并发布 (零Gas费)</button>
            </div>
    
            <div class="feed-tools">
                <div class="search-box">
                    <input type="text" id="search-input" class="modern-input" placeholder="搜索帖子标题或内容...">
                    <button class="btn btn-primary" onclick="renderApp()">搜索</button>
                </div>
            </div>
    
            <div id="post-list">
                </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/web3@4.10.0/dist/web3.min.js"></script>
    <script src="ipfs.js"></script>
    <script>
        // 【重要】记得确认这里是你新部署的 Rollup 合约地址
        const contractAddress = "0xbAc5371C93d6fBE8385D34bd08e78c174C644472"; 
        
        const abi = [
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"packetId","type":"uint256"},{"indexed":false,"internalType":"string","name":"cid","type":"string"},{"indexed":false,"internalType":"bytes32","name":"rootHash","type":"bytes32"},{"indexed":false,"internalType":"address","name":"relayer","type":"address"},{"indexed":false,"internalType":"uint256","name":"operationCount","type":"uint256"}],"name":"BatchSubmitted","type":"event"},
            {"inputs":[],"name":"getAllPackets","outputs":[{"components":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"string","name":"cid","type":"string"},{"internalType":"bytes32","name":"rootHash","type":"bytes32"},{"internalType":"uint256","name":"timestamp","type":"uint256"},{"internalType":"address","name":"relayer","type":"address"},{"internalType":"uint256","name":"operationCount","type":"uint256"}],"internalType":"struct ForumRollup.DataPacket[]","name":"","type":"tuple[]"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"dataPackets","outputs":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"string","name":"cid","type":"string"},{"internalType":"bytes32","name":"rootHash","type":"bytes32"},{"internalType":"uint256","name":"timestamp","type":"uint256"},{"internalType":"address","name":"relayer","type":"address"},{"internalType":"uint256","name":"operationCount","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"packetCounter","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"string","name":"_cid","type":"string"},{"internalType":"bytes32","name":"_rootHash","type":"bytes32"},{"internalType":"uint256","name":"_operationCount","type":"uint256"}],"name":"submitBatch","outputs":[],"stateMutability":"nonpayable","type":"function"}
        ];
    
        let web3, contract, accounts;
        
        // 核心状态机
        let appState = { sections: [], posts: [], comments: [], likes: {} };
        let mempool = []; 

        function generateId() { return 'id_' + Date.now() + '_' + Math.floor(Math.random() * 10000); }
        function shortenAddress(address) { return address ? address.substring(0, 6) + '...' + address.substring(address.length - 4) : ''; }

        // --- 1. 钱包连接 ---
        async function connectWallet() {
            if (!window.ethereum) { showStatus('请安装MetaMask钱包', 'error'); return; }
            try {
                accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                web3 = new Web3(window.ethereum);
                contract = new web3.eth.Contract(abi, contractAddress);
                document.getElementById('wallet-address').textContent = shortenAddress(accounts[0]);
                document.getElementById('connect-wallet').style.display = 'none';
                showStatus('钱包连接成功', 'success');
                
                await syncStateFromChain();
            } catch (error) {
                showStatus('连接失败: ' + error.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status status-${type}`;
            statusDiv.textContent = message;
            document.body.appendChild(statusDiv);
            setTimeout(() => {
                statusDiv.style.opacity = '0';
                statusDiv.style.transition = 'opacity 0.3s';
                setTimeout(() => statusDiv.remove(), 300);
            }, 3000);
        }

        // --- 2. 状态重构（已解决神秘消失的核心逻辑） ---
        function applyOperationToState(state, op) {
            if (!op || !op.type || !op.data) return; // 容错
            if (op.type === 'create_section') {
                if (!state.sections.find(s => s.id === op.data.id)) state.sections.push(op.data);
            } else if (op.type === 'create_post') {
                if (!state.posts.find(p => p.id === op.data.id)) state.posts.push(op.data);
            } else if (op.type === 'create_comment') {
                if (!state.comments.find(c => c.id === op.data.id)) state.comments.push(op.data);
            } else if (op.type === 'like') {
                const targetId = op.data.targetId;
                if (!state.likes[targetId]) state.likes[targetId] = [];
                if (!state.likes[targetId].includes(op.data.user)) state.likes[targetId].push(op.data.user);
            }
        }

        async function syncStateFromChain() {
            if (!contract) return;
            showStatus('正在从区块链与 IPFS 同步数据...', 'success');
            
            // 使用临时状态，防止同步期间清空页面
            let newState = { sections: [], posts: [], comments: [], likes: {} };
            
            try {
                const packets = await contract.methods.getAllPackets().call();
                
                for (const packet of packets) {
                    const cid = packet.cid || packet[1];
                    if (!cid) continue;

                    try {
                        const contentStr = await ipfsIntegration.getContent(cid);
                        
                        // 【核心修复 1】：拦截 IPFS 未同步时的 Mock 数据，防止破坏 JSON.parse
                        if (contentStr.startsWith('Mock content')) {
                            console.warn(`CID ${cid} 尚未在 IPFS 网络中就绪，请稍后刷新重试。`);
                            continue;
                        }

                        let parsed;
                        try {
                            parsed = JSON.parse(contentStr);
                            // 【核心修复 2】：解决 Pinata API 造成的“双重字符串化”问题
                            if (typeof parsed === 'string') {
                                parsed = JSON.parse(parsed);
                            }
                        } catch (e) {
                            console.warn(`解析 CID ${cid} JSON 数据失败:`, e);
                            continue;
                        }
                        
                        const operations = parsed.data || [];
                        for (const op of operations) {
                            applyOperationToState(newState, op);
                        }
                    } catch (e) {
                        console.warn('拉取或处理批次异常, CID:', cid, e);
                    }
                }
                
                appState = newState;
                renderApp(); 
                showStatus('数据同步完成', 'success');
            } catch (e) {
                console.error("同步区块链状态严重错误:", e);
                showStatus('同步区块链状态失败', 'error');
            }
        }

        // --- 3. 业务操作 ---
        async function signAndAddToMempool(type, data) {
            if (!accounts) { showStatus('请先连接钱包', 'error'); throw new Error('No wallet'); }
            
            const message = JSON.stringify(data);
            showStatus('请在钱包中签名确认 (免费)...', 'success');
            
            try {
                const signature = await web3.eth.personal.sign(message, accounts[0], '');
                
                mempool.push({ type, data, signature });
                
                document.getElementById('mempool-count').textContent = mempool.length;
                showStatus('操作已记录，等待打包上链', 'success');
                renderApp(); 
                
            } catch (error) {
                showStatus('用户取消了签名', 'error');
                throw error;
            }
        }

        async function createSection() {
            const name = document.getElementById('section-name').value;
            const desc = document.getElementById('section-description').value;
            if (!name || !desc) { showStatus('请填写完整', 'error'); return; }
            
            const data = { id: generateId(), name, description: desc, creator: accounts[0] };
            await signAndAddToMempool('create_section', data);
            
            document.getElementById('section-name').value = '';
            document.getElementById('section-description').value = '';
        }

        async function createPost() {
            const sectionId = document.getElementById('post-section').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const imageFile = document.getElementById('post-image').files[0];
            
            if (!sectionId || !title || !content) { showStatus('请填写完整的帖子信息', 'error'); return; }
            
            let imageCid = '', fileName = '';
            if (imageFile) {
                showStatus('正在上传附件至 IPFS...', 'success');
                imageCid = await ipfsIntegration.addFile(imageFile);
                fileName = imageFile.name;
            }

            const data = {
                id: generateId(), author: accounts[0], title, content, 
                timestamp: Date.now(), sectionId, imageCid, fileName
            };
            
            await signAndAddToMempool('create_post', data);
            
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            document.getElementById('post-image').value = '';
            document.getElementById('file-name').textContent = '';
            document.getElementById('image-preview').style.display = 'none';
        }

        async function createComment(postId) {
            const contentBox = document.getElementById(`comment-content-${postId}`);
            const content = contentBox.value;
            if (!content) { showStatus('评论不能为空', 'error'); return; }

            const data = { id: generateId(), postId, author: accounts[0], content, timestamp: Date.now() };
            await signAndAddToMempool('create_comment', data);
            contentBox.value = '';
        }

        async function likeEntity(targetId) {
            const data = { targetId, user: accounts[0], timestamp: Date.now() };
            await signAndAddToMempool('like', data);
        }

        // --- 4. Relayer 打包上链 ---
        async function submitBatchToChain() {
            if (mempool.length === 0) { showStatus('内存池为空，没有需要打包的数据', 'error'); return; }
            if (!contract) { showStatus('请连接钱包', 'error'); return; }

            try {
                showStatus(`正在打包 ${mempool.length} 条操作...`, 'success');
                const batchData = [...mempool]; 
                
                const packet = await ipfsIntegration.createDataPacket(batchData);
                
                // 【核心修复 3】：手动将数据结构写入本地内存缓存
                // 防止打包完毕后，页面立即调用 syncStateFromChain，遭遇 Pinata 延迟而导致数据消失
                const packetObj = { timestamp: Date.now(), data: batchData, version: '1.0' };
                ipfsIntegration.lightStorage.store(packet.cid, JSON.stringify(packetObj));

                showStatus('发送上链交易 (需要Gas)...', 'success');
                await contract.methods.submitBatch(packet.cid, packet.rootHash, batchData.length).send({ from: accounts[0] });

                showStatus('打包上链成功！', 'success');
                mempool = []; 
                document.getElementById('mempool-count').textContent = '0';
                
                await syncStateFromChain();
            } catch (error) {
                console.error(error);
                showStatus('打包失败: ' + error.message, 'error');
            }
        }

        // --- 5. 前端视图渲染 ---
        function renderApp() {
            let currentState = JSON.parse(JSON.stringify(appState)); 
            for (const op of mempool) { applyOperationToState(currentState, op); }

            const sectionList = document.getElementById('section-list');
            const postSectionSelect = document.getElementById('post-section');
            sectionList.innerHTML = '';
            postSectionSelect.innerHTML = '<option value="">请选择发帖分区...</option>';
            
            currentState.sections.forEach(sec => {
                sectionList.innerHTML += `
                    <div class="section-item">
                        <div class="section-icon">${sec.name.substring(0,1).toUpperCase()}</div>
                        <div class="section-details"><h4>${sec.name}</h4><p>${sec.description}</p></div>
                    </div>`;
                postSectionSelect.innerHTML += `<option value="${sec.id}">${sec.name}</option>`;
            });

            const postList = document.getElementById('post-list');
            postList.innerHTML = '';
            const keyword = document.getElementById('search-input').value.toLowerCase();
            
            const sortedPosts = currentState.posts.sort((a, b) => b.timestamp - a.timestamp);
            
            sortedPosts.forEach(post => {
                if (keyword && !post.title.toLowerCase().includes(keyword) && !post.content.toLowerCase().includes(keyword)) return;
                
                const section = currentState.sections.find(s => s.id === post.sectionId);
                const sectionName = section ? section.name : '未知分区';
                const likesCount = currentState.likes[post.id] ? currentState.likes[post.id].length : 0;
                
                let attachmentHtml = '';
                if (post.imageCid) {
                    const isImage = post.fileName && (post.fileName.endsWith('.jpg') || post.fileName.endsWith('.jpeg'));
                    if (isImage) {
                        attachmentHtml = `<img src="https://gateway.pinata.cloud/ipfs/${post.imageCid}" class="post-image">`;
                    } else {
                        attachmentHtml = `
                            <div class="attachment-box">
                                <span>📎 <span style="font-weight: 500;">${post.fileName || '附件'}</span></span>
                                <button onclick="window.open('https://gateway.pinata.cloud/ipfs/${post.imageCid}')" class="btn btn-primary btn-sm">下载</button>
                            </div>`;
                    }
                }

                const postHtml = `
                    <div class="post">
                        <div class="post-header">
                            <div class="post-avatar">${post.author.substring(2,4).toUpperCase()}</div>
                            <div class="post-meta-info">
                                <span class="post-author">${shortenAddress(post.author)}</span>
                                <span class="post-time">${new Date(post.timestamp).toLocaleString()}</span>
                            </div>
                            <span class="badge-section">${sectionName}</span>
                        </div>
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-content">${post.content}</div>
                        ${attachmentHtml}
                        
                        <div class="post-actions-bar">
                            <button class="action-btn" onclick="likeEntity('${post.id}')">
                                <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                                <span>点赞 (${likesCount})</span>
                            </button>
                            <button class="action-btn" onclick="document.getElementById('comment-form-${post.id}').style.display='block'">
                                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                                <span>评论</span>
                            </button>
                        </div>
                        
                        <div id="comment-form-${post.id}" class="comment-form-container" style="display: none;">
                            <textarea id="comment-content-${post.id}" class="modern-input" placeholder="输入你想说的内容..." style="min-height: 70px; margin-bottom: 12px;"></textarea>
                            <button class="btn btn-primary btn-sm" onclick="createComment('${post.id}')">发送评论</button>
                        </div>
                        
                        <div class="comments-list">
                            ${currentState.comments.filter(c => c.postId === post.id).sort((a, b) => a.timestamp - b.timestamp).map(c => `
                                <div class="comment-item">
                                    <div class="comment-avatar">${c.author.substring(2,4).toUpperCase()}</div>
                                    <div class="comment-body">
                                        <div class="comment-header">
                                            <span class="comment-author">${shortenAddress(c.author)}</span>
                                            <span class="comment-time">${new Date(c.timestamp).toLocaleString()}</span>
                                        </div>
                                        <div class="comment-text">${c.content}</div>
                                        <button class="action-btn comment-like-btn" onclick="likeEntity('${c.id}')" style="padding:0; height:auto;">
                                            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                                            ${currentState.likes[c.id] ? currentState.likes[c.id].length : 0}
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                postList.innerHTML += postHtml;
            });
        }

        function previewFile(input) {
            const fileName = document.getElementById('file-name');
            const imagePreview = document.getElementById('image-preview');
            const textPreview = document.getElementById('text-preview');
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const isImage = file.type.match('image/jpeg') || file.type.match('image/jpg');
                const isText = file.type.match('text/plain') || file.name.endsWith('.txt');
                fileName.textContent = file.name;
                
                if (isImage) {
                    const reader = new FileReader();
                    reader.onload = (e) => { imagePreview.src = e.target.result; imagePreview.style.display = 'block'; textPreview.style.display = 'none'; };
                    reader.readAsDataURL(file);
                } else if (isText) {
                    file.text().then(text => { textPreview.textContent = text; textPreview.style.display = 'block'; imagePreview.style.display = 'none'; });
                }
            }
        }

        window.onload = async function() {
            try { await ipfsIntegration.init(); } catch (e) {}
            // 如果钱包已授权，尝试自动连接
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) connectWallet();
                } catch (e) {}
                window.ethereum.on('accountsChanged', () => window.location.reload());
                window.ethereum.on('chainChanged', () => window.location.reload());
            }
        };
        document.getElementById('connect-wallet').addEventListener('click', connectWallet);
    </script>
</body>
</html>
