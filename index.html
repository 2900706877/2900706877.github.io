<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畅所欲言 - Web3去中心化论坛</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #F3F4F6;
            --bg-body: #F9FAFB;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }
    
    /* 导航栏 */
    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 0; }
    .nav-container { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
    .brand svg { width: 32px; height: 32px; fill: var(--primary); }
    
    #wallet-status { display: flex; align-items: center; gap: 12px; }
    #wallet-address { background: var(--secondary); padding: 8px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); font-family: monospace; display: none; }
    #wallet-address:not(:empty) { display: block; }

    /* 主布局 */
    .container { display: grid; grid-template-columns: 320px 1fr; gap: 32px; max-width: 1280px; margin: 32px auto; padding: 0 24px; }
    .container.placeholder { display: block; } /* 临时为了兼容原有JS选择器 */

    /* 通用卡片样式 */
    .card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; transition: box-shadow 0.3s ease; }
    .card:hover { box-shadow: var(--shadow-md); }
    .card-header { font-size: 1.125rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px;}

    /* 表单与输入框 */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    .modern-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; background: var(--bg-body); transition: all 0.2s; font-family: inherit; }
    .modern-input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    textarea.modern-input { resize: vertical; min-height: 100px; }

    /* 按钮 */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3); }
    .btn-secondary { background: var(--secondary); color: var(--text-main); }
    .btn-secondary:hover { background: #E5E7EB; }
    .btn-sm { padding: 8px 16px; font-size: 0.875rem; }

    /* 分区列表 */
    .section-list { display: flex; flex-direction: column; gap: 12px; }
    .section-item { padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; background: var(--surface); display: flex; gap: 16px; align-items: flex-start; }
    .section-item:hover { border-color: var(--primary); background: #F8FAFC; transform: translateX(4px); }
    .section-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(79, 70, 229, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.25rem; flex-shrink: 0; }
    .section-details h4 { font-size: 1rem; color: var(--text-main); margin-bottom: 4px; }
    .section-details p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    /* 帖子操作栏 & 过滤 */
    .feed-tools { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 250px; display: flex; gap: 8px; }
    .search-box .modern-input { border-radius: 30px; padding-left: 20px; }
    .sort-controls select { border-radius: 30px; padding: 10px 20px; background: var(--surface); border: 1px solid var(--border); font-size: 0.9rem; cursor: pointer; outline: none; }

    /* 帖子列表 */
    .post { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform 0.2s; }
    .post:hover { box-shadow: var(--shadow-md); }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .post-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #6366f1); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .post-meta-info { flex: 1; }
    .post-author { display: block; font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
    .post-time { font-size: 0.8rem; color: var(--text-muted); }
    .badge-section { background: rgba(79, 70, 229, 0.1); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .post-title { font-size: 1.25rem; margin-bottom: 12px; color: var(--text-main); }
    .post-content { color: #374151; font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; white-space: pre-wrap; }
    
    /* 附件样式 */
    .post-image { max-width: 100%; max-height: 400px; border-radius: var(--radius-md); margin-top: 12px; border: 1px solid var(--border); }
    .attachment-box { display: flex; align-items: center; justify-content: space-between; background: var(--secondary); padding: 12px 16px; border-radius: var(--radius-md); margin-top: 16px; }
    
    /* 帖子交互按钮 */
    .post-actions-bar { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
    .action-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; background: transparent; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; cursor: pointer; border-radius: 20px; transition: all 0.2s; }
    .action-btn:hover { background: var(--secondary); color: var(--primary); }
    .action-btn svg { width: 18px; height: 18px; }

    /* 评论区 */
    .comment-form-container { margin-top: 20px; background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); }
    .comments-list { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
    .comment-item { display: flex; gap: 12px; background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #2dd4bf); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; flex-shrink: 0; }
    .comment-body { flex: 1; }
    .comment-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .comment-author { font-weight: 600; font-size: 0.875rem; }
    .comment-time { font-size: 0.75rem; color: var(--text-muted); }
    .comment-text { font-size: 0.9rem; color: #4B5563; margin-bottom: 8px; }
    .comment-like-btn { padding: 4px 8px; font-size: 0.8rem; }

    /* 文件上传美化 */
    .file-input-wrapper { display: flex; align-items: center; gap: 12px; }
    .file-input-wrapper input[type=file] { display: none; }
    .file-input-label { display: inline-block; background: var(--secondary); color: var(--text-main); padding: 10px 20px; border-radius: var(--radius-md); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; border: 1px dashed #9CA3AF; }
    .file-input-label:hover { background: #E5E7EB; border-color: var(--primary); }
    #image-preview { max-width: 100%; border-radius: var(--radius-md); margin-top: 12px; }

    /* 状态 Toast (不再破坏DOM流) */
    .status { position: fixed; bottom: 24px; right: 24px; padding: 16px 24px; border-radius: var(--radius-md); font-weight: 500; z-index: 9999; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; box-shadow: var(--shadow-lg); max-width: 350px; }
    .status-success { background-color: var(--success); color: white; }
    .status-error { background-color: var(--danger); color: white; }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* 响应式 */
    @media (max-width: 992px) {
        .container { grid-template-columns: 1fr; }
        .sidebar { order: 2; }
        .main-feed { order: 1; }
    }
</style>
</head>
<body>
    <div class="container placeholder" style="display: none;"></div> <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                畅所欲言
            </div>
            <div id="wallet-status">
                <span id="wallet-address"></span>
                <button id="connect-wallet" class="btn btn-primary">连接钱包</button>
            </div>
        </div>
    </nav>
    <div class="container main-layout">
        <aside class="sidebar">
            <div class="card">
                <div class="card-header">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14"></path></svg>
                    创建分区
                </div>
                <div class="form-group">
                    <input type="text" id="section-name" class="modern-input" placeholder="输入分区名称">
                </div>
                <div class="form-group">
                    <textarea id="section-description" class="modern-input" placeholder="输入一句话分区描述..." style="min-height: 80px;"></textarea>
                </div>
                <button id="create-section" class="btn btn-primary" style="width: 100%;">确认创建</button>
            </div>
    
            <div class="card" style="background: transparent; box-shadow: none; border: none; padding: 0;">
                <div class="card-header" style="border-bottom: none; margin-bottom: 10px;">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    探索分区
                </div>
                <div id="section-list" class="section-list"></div>
            </div>
        </aside>
    
        <main class="main-feed">
            <div class="card">
                <div class="card-header">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    发布动态
                </div>
                <div class="form-group">
                    <select id="post-section" class="modern-input">
                        <option value="">请选择发帖分区...</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="post-title" class="modern-input" placeholder="标题：让大家知道你想说什么" style="font-weight: 500; font-size: 1.1rem;">
                </div>
                <div class="form-group">
                    <textarea id="post-content" class="modern-input" placeholder="在此输入帖子正文..."></textarea>
                </div>
                <div class="form-group">
                    <div class="file-input-wrapper">
                        <label for="post-image" class="file-input-label">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="vertical-align: middle; margin-right: 4px;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            添加图片或TXT附件
                        </label>
                        <input type="file" id="post-image" accept=".jpg,.jpeg,.txt" onchange="previewFile(this)">
                        <span id="file-name" style="font-size: 0.85rem; color: var(--text-muted);"></span>
                    </div>
                    <img id="image-preview" alt="图片预览" style="display: none;">
                    <div id="text-preview" style="display: none; margin-top: 12px; padding: 16px; background: var(--bg-body); border-radius: var(--radius-sm); border: 1px solid var(--border); max-height: 200px; overflow-y: auto; font-size: 0.9rem;"></div>
                </div>
                <button id="create-post" class="btn btn-primary">立即发布</button>
            </div>
    
            <div class="feed-tools">
                <div class="search-box">
                    <input type="text" id="search-input" class="modern-input" placeholder="搜索帖子标题或内容...">
                    <button class="btn btn-primary" onclick="searchPosts()">搜索</button>
                    <button class="btn btn-secondary" onclick="clearSearch()">清除</button>
                </div>
                <div class="sort-controls">
                    <select id="sort-by" onchange="loadPosts()">
                        <option value="time-desc">最新发布优先</option>
                        <option value="time-asc">最早发布优先</option>
                        <option value="likes-desc">点赞数最多优先</option>
                        <option value="likes-asc">点赞数最少优先</option>
                    </select>
                </div>
            </div>
    
            <div id="post-list">
                </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/web3@4.10.0/dist/web3.min.js"></script>
    <script src="ipfs.js"></script>
    <script>
        const abi = [
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"postId","type":"uint256"},{"indexed":false,"internalType":"address","name":"author","type":"address"},{"indexed":false,"internalType":"uint256","name":"sectionId","type":"uint256"},{"indexed":false,"internalType":"string","name":"cid","type":"string"}],"name":"PostCreated","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"commentId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"postId","type":"uint256"},{"indexed":false,"internalType":"address","name":"author","type":"address"},{"indexed":false,"internalType":"string","name":"cid","type":"string"}],"name":"CommentCreated","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"postId","type":"uint256"},{"indexed":false,"internalType":"address","name":"user","type":"address"}],"name":"PostLiked","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"commentId","type":"uint256"},{"indexed":false,"internalType":"address","name":"user","type":"address"}],"name":"CommentLiked","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"sectionId","type":"uint256"},{"indexed":false,"internalType":"string","name":"name","type":"string"},{"indexed":false,"internalType":"address","name":"creator","type":"address"}],"name":"SectionCreated","type":"event"},
            {"inputs":[{"internalType":"string","name":"_name","type":"string"},{"internalType":"string","name":"_description","type":"string"}],"name":"createSection","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_sectionId","type":"uint256"},{"internalType":"string","name":"_title","type":"string"},{"internalType":"string","name":"_content","type":"string"},{"internalType":"string","name":"_cid","type":"string"},{"internalType":"string","name":"_imageCid","type":"string"},{"internalType":"string","name":"_fileName","type":"string"}],"name":"createPost","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_postId","type":"uint256"},{"internalType":"string","name":"_content","type":"string"},{"internalType":"string","name":"_cid","type":"string"}],"name":"createComment","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_postId","type":"uint256"}],"name":"likePost","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_commentId","type":"uint256"}],"name":"likeComment","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_postId","type":"uint256"}],"name":"getPostLikes","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_commentId","type":"uint256"}],"name":"getCommentLikes","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_postId","type":"uint256"},{"internalType":"address","name":"_user","type":"address"}],"name":"hasUserLikedPost","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_commentId","type":"uint256"},{"internalType":"address","name":"_user","type":"address"}],"name":"hasUserLikedComment","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_postId","type":"uint256"}],"name":"getPost","outputs":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"address","name":"author","type":"address"},{"internalType":"string","name":"title","type":"string"},{"internalType":"string","name":"content","type":"string"},{"internalType":"string","name":"cid","type":"string"},{"internalType":"string","name":"imageCid","type":"string"},{"internalType":"string","name":"fileName","type":"string"},{"internalType":"uint256","name":"timestamp","type":"uint256"},{"internalType":"uint256","name":"sectionId","type":"uint256"},{"internalType":"uint256","name":"likes","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"getAllPostIds","outputs":[{"internalType":"uint256[]","name":"","type":"uint256[]"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"comments","outputs":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"uint256","name":"postId","type":"uint256"},{"internalType":"address","name":"author","type":"address"},{"internalType":"string","name":"content","type":"string"},{"internalType":"string","name":"cid","type":"string"},{"internalType":"uint256","name":"timestamp","type":"uint256"},{"internalType":"uint256","name":"likes","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"sections","outputs":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"string","name":"name","type":"string"},{"internalType":"string","name":"description","type":"string"},{"internalType":"address","name":"creator","type":"address"},{"internalType":"uint256","name":"createdAt","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"postCounter","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"commentCounter","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"sectionCounter","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}
        ];
    
        const contractAddress = "0x142a1ddd434ba273fa9211575ff7a0c872552251";
        let web3, contract, accounts;
        let currentSearchKeyword = '';
        let isConnecting = false;
        let isWalletConnected = false;
    
        // 简短地址辅助函数
        function shortenAddress(address) {
            return address ? address.substring(0, 6) + '...' + address.substring(address.length - 4) : '';
        }
    
        async function connectWallet() {
            if (!window.ethereum) {
                showStatus('请安装MetaMask钱包', 'error');
                return;
            }
            if (isConnecting || isWalletConnected) return;
            isConnecting = true;
            try {
                accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                web3 = new Web3(window.ethereum);
                const chainId = await web3.eth.getChainId();
                if (chainId !== 11155111n) {
                    showStatus('请切换到Sepolia测试网络', 'error');
                    isConnecting = false;
                    return;
                }
                contract = new web3.eth.Contract(abi, contractAddress);
                document.getElementById('wallet-address').textContent = shortenAddress(accounts[0]);
                document.getElementById('connect-wallet').style.display = 'none';
                showStatus('钱包连接成功', 'success');
                await loadSections();
                await loadPosts();
                isWalletConnected = true;
            } catch (error) {
                showStatus('连接钱包失败: ' + error.message, 'error');
            } finally {
                isConnecting = false;
            }
        }
    
        function showStatus(message, type) {
            const statusDiv = document.createElement('div');
            statusDiv.className = `status status-${type}`;
            statusDiv.textContent = message;
            document.body.appendChild(statusDiv); // 更改为附加到 body，不破坏布局
            setTimeout(() => {
                statusDiv.style.opacity = '0';
                statusDiv.style.transition = 'opacity 0.3s';
                setTimeout(() => statusDiv.remove(), 300);
            }, 3000);
        }
    
        async function loadSections() {
            if (!contract) return;
            try {
                const sectionCounter = await contract.methods.sectionCounter().call();
                const sectionList = document.getElementById('section-list');
                const postSectionSelect = document.getElementById('post-section');
                sectionList.innerHTML = '';
                postSectionSelect.innerHTML = '<option value="">请选择发帖分区...</option>';
                
                if (sectionCounter == 0) {
                    sectionList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px 0;">暂无分区，快来创建第一个吧</p>';
                    return;
                }
                
                for (let i = 1; i <= sectionCounter; i++) {
                    const section = await contract.methods.sections(i).call();
                    const sectionItem = document.createElement('div');
                    sectionItem.className = 'section-item';
                    
                    // 新设计的 HTML
                    sectionItem.innerHTML = `
                        <div class="section-icon">${section.name.substring(0,1).toUpperCase()}</div>
                        <div class="section-details">
                            <h4>${section.name}</h4>
                            <p>${section.description}</p>
                        </div>
                    `;
                    sectionItem.addEventListener('click', function() {
                        loadPostsBySection(section.id);
                        document.querySelectorAll('.section-item').forEach(item => {
                            item.style.borderColor = 'var(--border)';
                            item.style.background = 'var(--surface)';
                        });
                        this.style.borderColor = 'var(--primary)';
                        this.style.background = '#F8FAFC';
                    });
                    sectionList.appendChild(sectionItem);
                    
                    const option = document.createElement('option');
                    option.value = section.id;
                    option.textContent = section.name;
                    postSectionSelect.appendChild(option);
                }
            } catch (error) {
                showStatus('加载分区失败', 'error');
            }
        }
    
        async function loadPosts() {
            loadPostsBySection(0);
        }
    
        async function loadPostsBySection(sectionId) {
            if (!contract) return;
            const postList = document.getElementById('post-list');
            
            try {
                postList.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);"><svg style="animation: spin 1s linear infinite;" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg><p style="margin-top:12px;">正在加载星球电波...</p></div><style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>';
                const sectionIdNum = parseInt(sectionId);
                const sortBy = document.getElementById('sort-by').value;
                const postIds = await contract.methods.getAllPostIds().call();
                
                if (postIds.length === 0) {
                    postList.innerHTML = '<div class="card" style="text-align: center; color: #999; padding: 40px;">这片宇宙空空如也，发布第一条动态吧</div>';
                    return;
                }
                
                postList.innerHTML = '';
                const posts = [];
                
                for (const postId of postIds) {
                    const post = await contract.methods.getPost(postId).call();
                    const postSectionId = Number(post.sectionId);
                    const postTimestamp = Number(post.timestamp);
                    const postLikes = Number(post.likes);
                    const postIdNum = Number(post.id);
                    
                    if (sectionIdNum != 0 && postSectionId != sectionIdNum) continue;
                    
                    if (currentSearchKeyword) {
                        const keyword = currentSearchKeyword.toLowerCase();
                        if (!post.title.toLowerCase().includes(keyword) && !post.content.toLowerCase().includes(keyword)) continue;
                    }
                    
                    const section = await contract.methods.sections(post.sectionId).call();
                    posts.push({ id: postIdNum, author: post.author, title: post.title, content: post.content, cid: post.cid, imageCid: post.imageCid, fileName: post.fileName, timestamp: postTimestamp, sectionId: postSectionId, likes: postLikes, sectionName: section.name });
                }
                
                if (posts.length === 0) {
                    postList.innerHTML = '<div class="card" style="text-align: center; color: #999; padding: 40px;">没有找到符合条件的帖子</div>';
                    return;
                }
                
                posts.sort((a, b) => {
                    switch (sortBy) {
                        case 'time-desc': return b.timestamp - a.timestamp;
                        case 'time-asc': return a.timestamp - b.timestamp;
                        case 'likes-desc': return b.likes - a.likes;
                        case 'likes-asc': return a.likes - b.likes;
                        default: return b.timestamp - a.timestamp;
                    }
                });
                
                for (const post of posts) {
                    const postItem = document.createElement('div');
                    postItem.className = 'post';
                    
                    let attachmentHtml = '';
                    if (post.imageCid && post.imageCid !== '') {
                        const isImage = post.fileName && (post.fileName.endsWith('.jpg') || post.fileName.endsWith('.jpeg'));
                        const isText = post.fileName && post.fileName.endsWith('.txt');
                        
                        if (isImage) {
                            attachmentHtml = `<img src="https://gateway.pinata.cloud/ipfs/${post.imageCid}" alt="帖子图片" class="post-image" onerror="this.style.display='none'">`;
                        } else {
                            // 附件下载区美化
                            let icon = isText ? '📄' : '📎';
                            let fName = post.fileName || '未知文件';
                            attachmentHtml = `
                                <div class="attachment-box">
                                    <span>${icon} <span style="font-weight: 500;">${fName}</span></span>
                                    <button onclick="downloadFile('${post.imageCid}', '${fName}')" class="btn btn-primary btn-sm">下载附件</button>
                                </div>
                            `;
                        }
                    }
                    
                    const postIdStr = String(post.id);
                    // 全新设计的帖子内层 HTML
                    postItem.innerHTML = `
                        <div class="post-header">
                            <div class="post-avatar">${post.author.substring(2,4).toUpperCase()}</div>
                            <div class="post-meta-info">
                                <span class="post-author" title="${post.author}">${shortenAddress(post.author)}</span>
                                <span class="post-time">${new Date(post.timestamp * 1000).toLocaleString()}</span>
                            </div>
                            <span class="badge-section">${post.sectionName}</span>
                        </div>
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-content">${post.content}</div>
                        ${attachmentHtml}
                        
                        <div class="post-actions-bar">
                            <button class="action-btn" onclick="likePost(${postIdStr})">
                                <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                                <span>点赞 (${post.likes})</span>
                            </button>
                            <button class="action-btn" onclick="toggleCommentForm('${postIdStr}')">
                                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                                <span>评论</span>
                            </button>
                        </div>
                        
                        <div id="comment-form-${postIdStr}" class="comment-form-container" style="display: none;">
                            <textarea id="comment-content-${postIdStr}" class="modern-input" placeholder="输入你想说的内容..." style="min-height: 70px; margin-bottom: 12px;"></textarea>
                            <button class="btn btn-primary btn-sm" id="btn-submit-comment-${postIdStr}">发送评论</button>
                        </div>
                        
                        <div id="comments-${postIdStr}" class="comments-list"></div>
                    `;
                    postList.appendChild(postItem);
                    
                    const submitBtn = document.getElementById(`btn-submit-comment-${postIdStr}`);
                    if (submitBtn) {
                        submitBtn.addEventListener('click', () => createComment(postIdStr));
                    }
                    
                    loadComments(post.id);
                }
            } catch (error) {
                postList.innerHTML = '<p style="text-align: center; color: var(--danger); padding: 20px;">加载帖子失败，请刷新重试</p>';
            }
        }
    
        function searchPosts() {
            currentSearchKeyword = document.getElementById('search-input').value.trim();
            loadPosts();
        }
    
        function clearSearch() {
            document.getElementById('search-input').value = '';
            currentSearchKeyword = '';
            loadPosts();
        }
    
        async function downloadFile(cid, fileName) {
            try {
                showStatus('正在准备下载...', 'success');
                const url = `https://gateway.pinata.cloud/ipfs/${cid}`;
                
                const response = await fetch(url, { method: 'GET', mode: 'cors' });
                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = fileName || 'download.txt';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(downloadUrl);
                    showStatus('下载已开始', 'success');
                    return;
                }
            } catch (error) {
                window.open(`https://gateway.pinata.cloud/ipfs/${cid}`, '_blank');
            }
        }
    
        function previewFile(input) {
            const fileName = document.getElementById('file-name');
            const imagePreview = document.getElementById('image-preview');
            const textPreview = document.getElementById('text-preview');
            
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const isImage = file.type.match('image/jpeg') || file.type.match('image/jpg');
                const isText = file.type.match('text/plain') || file.name.endsWith('.txt');
                
                if (!isImage && !isText) {
                    showStatus('请选择JPG图片或TXT文本文件', 'error');
                    input.value = '';
                    return;
                }
                
                if (file.size > 5 * 1024 * 1024) {
                    showStatus('文件大小不能超过5MB', 'error');
                    input.value = '';
                    return;
                }
                
                fileName.textContent = file.name;
                
                if (isImage) {
                    const reader = new FileReader();
                    reader.onload = (e) => { imagePreview.src = e.target.result; imagePreview.style.display = 'block'; textPreview.style.display = 'none'; };
                    reader.readAsDataURL(file);
                } else if (isText) {
                    file.text().then(text => { textPreview.textContent = text; textPreview.style.display = 'block'; imagePreview.style.display = 'none'; });
                }
            } else {
                fileName.textContent = '';
                imagePreview.style.display = 'none';
                textPreview.style.display = 'none';
            }
        }
    
        async function loadComments(postId) {
            if (!contract) return;
            try {
                const commentCounter = await contract.methods.commentCounter().call();
                const commentsDiv = document.getElementById(`comments-${postId}`);
                commentsDiv.innerHTML = '';
                
                for (let i = 1; i <= commentCounter; i++) {
                    const comment = await contract.methods.comments(i).call();
                    if (Number(comment.postId) === Number(postId)) {
                        const commentItem = document.createElement('div');
                        commentItem.className = 'comment-item';
                        // 全新评论 UI
                        commentItem.innerHTML = `
                            <div class="comment-avatar">${comment.author.substring(2,4).toUpperCase()}</div>
                            <div class="comment-body">
                                <div class="comment-header">
                                    <span class="comment-author" title="${comment.author}">${shortenAddress(comment.author)}</span>
                                    <span class="comment-time">${new Date(Number(comment.timestamp) * 1000).toLocaleString()}</span>
                                </div>
                                <div class="comment-text">${comment.content}</div>
                                <button class="action-btn comment-like-btn" onclick="likeComment(${Number(comment.id)})" style="padding:0; height:auto;">
                                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                                    ${Number(comment.likes)}
                                </button>
                            </div>
                        `;
                        commentsDiv.appendChild(commentItem);
                    }
                }
            } catch (error) {
                showStatus('加载评论失败', 'error');
            }
        }
    
        function toggleCommentForm(postId) {
            const form = document.getElementById(`comment-form-${postId}`);
            if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }
    
        async function createSection() {
            if (!contract || !accounts) { showStatus('请先连接钱包', 'error'); return; }
            const name = document.getElementById('section-name').value;
            const description = document.getElementById('section-description').value;
            if (!name || !description) { showStatus('请填写分区名称和描述', 'error'); return; }
            try {
                await contract.methods.createSection(name, description).send({ from: accounts[0] });
                showStatus('分区创建成功', 'success');
                document.getElementById('section-name').value = '';
                document.getElementById('section-description').value = '';
                loadSections();
            } catch (error) { showStatus('创建分区失败', 'error'); }
        }
    
        async function createPost() {
            if (!contract || !accounts) { showStatus('请先连接钱包', 'error'); return; }
            const sectionId = document.getElementById('post-section').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const imageFile = document.getElementById('post-image').files[0];
            
            if (!sectionId || !title || !content) { showStatus('请填写完整的帖子信息', 'error'); return; }
            
            try {
                showStatus('正在上传内容到IPFS...', 'success');
                const cid = await ipfsIntegration.addContent(content);
                
                let imageCid = '', fileName = '';
                if (imageFile) {
                    showStatus('正在上传文件到IPFS...', 'success');
                    imageCid = await ipfsIntegration.addFile(imageFile);
                    fileName = imageFile.name;
                }
                
                showStatus('正在提交到区块链...', 'success');
                await contract.methods.createPost(sectionId, title, content, cid, imageCid, fileName).send({ from: accounts[0] });
                
                showStatus('帖子发布成功', 'success');
                document.getElementById('post-section').value = '';
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                document.getElementById('post-image').value = '';
                document.getElementById('file-name').textContent = '';
                document.getElementById('image-preview').style.display = 'none';
                document.getElementById('text-preview').style.display = 'none';
                await loadPosts();
            } catch (error) { showStatus('发布帖子失败', 'error'); }
        }
    
        async function createComment(postId) {
            if (!contract || !accounts) { showStatus('请先连接钱包', 'error'); return; }
            const postIdNum = Number(postId);
            const contentElement = document.getElementById(`comment-content-${postIdNum}`);
            
            if (!contentElement) { showStatus('系统错误', 'error'); return; }
            
            const content = contentElement.value;
            if (!content || content.trim() === '') { showStatus('请填写评论内容', 'error'); return; }
            
            try {
                showStatus('正在上传评论到IPFS...', 'success');
                const cid = await ipfsIntegration.addContent(content);
                showStatus('正在提交评论...', 'success');
                await contract.methods.createComment(postIdNum, content, cid).send({ from: accounts[0], gas: 500000 });
                showStatus('评论发布成功', 'success');
                contentElement.value = '';
                document.getElementById(`comment-form-${postIdNum}`).style.display = 'none';
                loadComments(postIdNum);
            } catch (error) { showStatus('发布评论失败', 'error'); }
        }
    
        async function likePost(postId) {
            if (!contract || !accounts) { showStatus('请先连接钱包', 'error'); return; }
            try {
                const hasLiked = await contract.methods.hasUserLikedPost(postId, accounts[0]).call();
                if (hasLiked) { showStatus('您已经点赞过该帖子', 'error'); return; }
                await contract.methods.likePost(postId).send({ from: accounts[0] });
                showStatus('点赞成功', 'success');
                loadPosts();
            } catch (error) { showStatus('点赞失败', 'error'); }
        }
    
        async function likeComment(commentId) {
            if (!contract || !accounts) { showStatus('请先连接钱包', 'error'); return; }
            try {
                const hasLiked = await contract.methods.hasUserLikedComment(commentId, accounts[0]).call();
                if (hasLiked) { showStatus('您已经点赞过该评论', 'error'); return; }
                await contract.methods.likeComment(commentId).send({ from: accounts[0] });
                showStatus('点赞成功', 'success');
                const comment = await contract.methods.comments(commentId).call();
                loadComments(comment.postId);
            } catch (error) { showStatus('点赞失败', 'error'); }
        }
    
        document.getElementById('connect-wallet').addEventListener('click', connectWallet);
        document.getElementById('create-section').addEventListener('click', createSection);
        document.getElementById('create-post').addEventListener('click', createPost);
    
        window.toggleCommentForm = toggleCommentForm;
        window.createComment = createComment;
        window.likePost = likePost;
        window.likeComment = likeComment;
        window.loadPostsBySection = loadPostsBySection;
        window.searchPosts = searchPosts;
        window.clearSearch = clearSearch;
        window.previewFile = previewFile;
        window.downloadFile = downloadFile;
    
        window.onload = async function() {
            try { await ipfsIntegration.init(); } catch (e) {}
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) await connectWallet();
                } catch (e) {}
            }
        };
    
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (newAccounts) => {
                if (newAccounts.length === 0) {
                    document.getElementById('wallet-address').textContent = '';
                    document.getElementById('connect-wallet').style.display = 'inline-flex';
                    contract = null;
                    isWalletConnected = false;
                    showStatus('钱包已断开连接', 'error');
                } else if (!isWalletConnected) {
                    connectWallet();
                }
            });
            window.ethereum.on('chainChanged', () => window.location.reload());
        }
    </script>
